name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaDock.xcodeproj \
            -scheme MangaDock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MangaDock.app"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MangaDock.ipa Payload
          ls -lh MangaDock.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaDock-ipa
          path: MangaDock.ipa
          if-no-files-found: error

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Release 说明来自 CHANGELOG.md 的最新一节 —— 只维护一处，CI 和 QQ 通知都读它。
      - name: Extract release notes
        run: |
          set -e
          {
            awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "**安装**：下载 \`MangaDock.ipa\`，用 SideStore / AltStore / LiveContainer 侧载。要求 iOS 18+。"
            echo ""
            echo "\`\`\`"
            echo "版本 ${{ steps.version.outputs.version }} · 构建号见包内 Info.plist"
            echo "\`\`\`"
          } > notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MangaDock ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: MangaDock.ipa
          overwrite_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
